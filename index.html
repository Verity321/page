<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сапёр 150 × 150</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      color: #e8edff;
      background: #111522;
      font-family: system-ui, sans-serif;
    }

    main { max-width: 900px; margin: auto; }

    h1 { margin: 0 0 6px; }

    .toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin: 18px 0;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 16px;
      color: #111522;
      background: #a8c7ff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .stats {
      padding: 9px 12px;
      border: 1px solid #30384e;
      border-radius: 10px;
      background: #1a2030;
    }

    #status { min-height: 24px; color: #ffd66b; }

    #board-wrap {
      width: 100%;
      height: min(70vh, 680px);
      overflow: auto;
      border: 2px solid #3a4560;
      border-radius: 12px;
      background: #20283a;
      overscroll-behavior: contain;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(150, 22px);
      grid-template-rows: repeat(150, 22px);
      width: max-content;
      user-select: none;
    }

    .cell {
      display: grid;
      place-items: center;
      width: 22px;
      height: 22px;
      border: 1px solid #69738a;
      background: #aeb9ce;
      color: #152036;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .cell:hover:not(.open) { background: #d1d9e8; }

    .cell.open {
      border-color: #485267;
      background: #dce2ed;
      cursor: default;
    }

    .cell.flag { background: #ffd66b; }
    .cell.mine { background: #ff647c; }

    .n1 { color: #1764d1; }
    .n2 { color: #18844a; }
    .n3 { color: #d63737; }
    .n4 { color: #693ec1; }
    .n5 { color: #9b481c; }
    .n6 { color: #138c98; }
    .n7 { color: #222; }
    .n8 { color: #687080; }
  </style>
</head>
<body>
  <main>
    <h1>💣 Сапёр 150 × 150</h1>
    <div>Открывай клетки. Правый клик — поставить или убрать флажок.</div>

    <div class="toolbar">
      <button id="new-game">Новая игра</button>
      <div class="stats">🚩 Флажки: <span id="flags">0</span> / 3375</div>
      <div class="stats">⏱️ Время: <span id="time">0</span> сек.</div>
    </div>

    <div id="status">Первый клик всегда безопасен.</div>

    <div id="board-wrap">
      <div id="board" aria-label="Игровое поле сапёра"></div>
    </div>
  </main>

  <script>
    const SIZE = 150;
    const MINES = 3375;
    const boardElement = document.getElementById("board");
    const flagsElement = document.getElementById("flags");
    const timeElement = document.getElementById("time");
    const statusElement = document.getElementById("status");

    let cells, gameOver, started, flagCount, seconds, timer;

    function startGame() {
      clearInterval(timer);
      cells = Array.from({ length: SIZE * SIZE }, () => ({
        mine: false, open: false, flagged: false, count: 0
      }));
      gameOver = false;
      started = false;
      flagCount = 0;
      seconds = 0;
      flagsElement.textContent = "0";
      timeElement.textContent = "0";
      statusElement.textContent = "Первый клик всегда безопасен.";

      boardElement.replaceChildren();
      const fragment = document.createDocumentFragment();

      for (let i = 0; i < cells.length; i++) {
        const el = document.createElement("div");
        el.className = "cell";
        el.dataset.index = i;
        el.addEventListener("click", () => openCell(i));
        el.addEventListener("contextmenu", event => {
          event.preventDefault();
          toggleFlag(i);
        });
        fragment.appendChild(el);
      }

      boardElement.appendChild(fragment);
    }

    function neighbors(index) {
      const row = Math.floor(index / SIZE);
      const col = index % SIZE;
      const result = [];

      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          const r = row + dr, c = col + dc;
          if (r >= 0 && r < SIZE && c >= 0 && c < SIZE) {
            result.push(r * SIZE + c);
          }
        }
      }
      return result;
    }

    function plantMines(safeIndex) {
      const safe = new Set([safeIndex, ...neighbors(safeIndex)]);
      let planted = 0;

      while (planted < MINES) {
        const i = Math.floor(Math.random() * cells.length);
        if (cells[i].mine || safe.has(i)) continue;
        cells[i].mine = true;
        planted++;
      }

      for (let i = 0; i < cells.length; i++) {
        if (!cells[i].mine) {
          cells[i].count = neighbors(i).filter(n => cells[n].mine).length;
        }
      }
    }

    function openCell(index) {
      if (gameOver || cells[index].open || cells[index].flagged) return;

      if (!started) {
        started = true;
        plantMines(index);
        timer = setInterval(() => {
          seconds++;
          timeElement.textContent = seconds;
        }, 1000);
      }

      if (cells[index].mine) {
        cells[index].open = true;
        drawCell(index);
        loseGame();
        return;
      }

      // Итеративное раскрытие пустой области, чтобы не переполнять стек.
      const queue = [index];
      let cursor = 0;

      while (cursor < queue.length) {
        const current = queue[cursor++];
        const cell = cells[current];
        if (cell.open || cell.flagged || cell.mine) continue;

        cell.open = true;

        if (cell.count === 0) {
          for (const n of neighbors(current)) {
            if (!cells[n].open && !cells[n].flagged && !cells[n].mine) {
              queue.push(n);
            }
          }
        }
      }

      drawAllOpen();
      checkWin();
    }

    function toggleFlag(index) {
      if (gameOver || cells[index].open) return;

      cells[index].flagged = !cells[index].flagged;
      flagCount += cells[index].flagged ? 1 : -1;
      flagsElement.textContent = flagCount;
      drawCell(index);
      checkWin();
    }

    function drawCell(index) {
      const cell = cells[index];
      const el = boardElement.children[index];

      el.className = "cell";
      el.textContent = "";

      if (cell.flagged && !cell.open) {
        el.classList.add("flag");
        el.textContent = "🚩";
      } else if (cell.open) {
        el.classList.add("open");
        if (cell.mine) {
          el.classList.add("mine");
          el.textContent = "💣";
        } else if (cell.count > 0) {
          el.classList.add(`n${cell.count}`);
          el.textContent = cell.count;
        }
      }
    }

    function drawAllOpen() {
      for (let i = 0; i < cells.length; i++) {
        if (cells[i].open) drawCell(i);
      }
    }

    function loseGame() {
      gameOver = true;
      clearInterval(timer);
      for (let i = 0; i < cells.length; i++) {
        if (cells[i].mine) {
          cells[i].open = true;
          drawCell(i);
        }
      }
      statusElement.textContent = "Бум! Ты подорвался. Нажми «Новая игра».";
    }

    function checkWin() {
      const won = cells.every(cell => cell.mine ? cell.flagged : cell.open);
      if (won && !gameOver) {
        gameOver = true;
        clearInterval(timer);
        statusElement.textContent = "🎉 Победа! Все мины найдены.";
      }
    }

    document.getElementById("new-game").addEventListener("click", startGame);
    startGame();
  </script>
</body>
</html>
